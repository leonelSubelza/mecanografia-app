<div class="span-container"><span>Escribe esto:</span></div>

<div class="letter-container">
  @for (letter of this._sprintModeHandlerService.wordBoard(); track $index) {
  <div [ngClass]="{
    'active': letter.isActive && !this._sprintModeHandlerService.gameOver(), 
    'correct': getLetterStatus(letter) === 'CORRECT',
    'incorrect': getLetterStatus(letter) === 'INCORRECT',
    }" class="letter">{{ letter.letter }}</div>
  }
  @for (value of this._sprintModeHandlerService.scoreToShowStack(); track $index) {
  <label [class.normal]="value.type === 'normal'" [class.perfect]="value.type === 'perfect'">{{ value.message
    }}</label>
  }
</div>
