<app-toolbar 
(onRestartGame)="handleRestartGame()"
(onStartNewGame)="handleNewGame()"
/>
<div class="game-content">
  <app-game-info />
  <div class="board-container">
    <div class="board-title">
      <h1>Texto: "{{this._appStateService.textContent().title}}"</h1>
    </div>
    <app-board />
  </div>
  <app-typing-display [input]="this._appStateService.valueUserWriting()" [currentWord]="this.currentWord"
    (onInput)="handleInputWritten($event)" />
</div>
